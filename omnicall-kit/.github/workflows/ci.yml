name: OmniCall Kit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: omnicall-kit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: SDK preflight and package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Preflight
        run: npm run release:preflight
        env:
          OMNICALL_SDK_BROWSER: '1'
          CI: 'true'

      - name: Release check (no publish)
        run: npm run release:check

      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: omnicall-kit-tarballs
          path: |
            temp/tarballs/*.tgz
            temp/tarballs/manifest.json
          if-no-files-found: error

      - name: Guard against accidental publish in CI
        run: |
          if grep -R -n -E 'npm[[:space:]]+publish|changeset[[:space:]]+publish' \
            --include='*.yml' --include='*.yaml' .github; then
            echo "CI workflows must not run npm publish."
            exit 1
          fi
          echo "No publish step in workflows."
