name: Release

# Tag v*.*.* → build on matrix → direct upload to omnicall-releases (no GitHub Artifacts).
# workflow_dispatch → build validation only (no publish, no Artifacts).
# Guide: guides/RELEASE-PLAYBOOK.md, guides/Distribution-Migration-Checklist.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers to omnicall-releases (run on a v*.*.* tag ref)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OmniCall Protocol
        run: npm run build:protocol

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Feature Registry paths
        run: npm run registry:check

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            output_dir: dist/win
          - os: macos-latest
            build_script: build:mac
            output_dir: dist/mac
          - os: ubuntu-latest
            build_script: build:linux
            output_dir: dist/linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OmniCall Protocol
        run: npm run build:protocol

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt

      - name: Install Python build dependencies
        run: pip install -r scripts/requirements-build.txt

      - name: Build installer
        run: npm run ${{ matrix.build_script }}
        env:
          EPUBLISH: never
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Stage installer binaries only
        env:
          SOURCE_DIR: ${{ matrix.output_dir }}
          DEST_DIR: release-staging
        run: node scripts/collect-installer-artifacts.mjs

      - name: Publish installers to omnicall-releases
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v'))
        env:
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.OMNICALL_RELEASES_TOKEN || secrets.AXATALK_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PAYLOAD_DIR: release-staging
        run: node scripts/publish-distribution-release.mjs

  finalize-distribution:
    name: Finalize manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Sync distribution manifest
        run: node scripts/sync-release-manifest.mjs

      - name: Push distribution docs to omnicall-releases main
        env:
          GITHUB_TOKEN: ${{ secrets.OMNICALL_RELEASES_TOKEN || secrets.AXATALK_RELEASES_TOKEN }}
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.OMNICALL_RELEASES_TOKEN || secrets.AXATALK_RELEASES_TOKEN }}
          DIST_COMMIT_MSG: "chore(release): sync manifest for ${{ github.ref_name }}"
        run: node scripts/push-distribution-repo.mjs

      - name: Publish release notes to omnicall-releases
        env:
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.OMNICALL_RELEASES_TOKEN || secrets.AXATALK_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/update-distribution-release-notes.mjs
