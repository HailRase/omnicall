name: Release

# Tag v*.*.* on softphone-electron - build installers - publish to axatalk-releases.
# workflow_dispatch → build only (Artifacts), no publish.
# Guide: guides/RELEASE-PLAYBOOK.md, guides/Distribution-Migration-Checklist.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Feature Registry paths
        run: npm run registry:check

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            output_dir: dist/win
          - os: macos-latest
            build_script: build:mac
            output_dir: dist/mac
          - os: ubuntu-latest
            build_script: build:linux
            output_dir: dist/linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt

      - name: Install Python build dependencies
        run: pip install -r scripts/requirements-build.txt

      - name: Build installer
        run: npm run ${{ matrix.build_script }}
        env:
          EPUBLISH: never
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Stage installer binaries only
        env:
          SOURCE_DIR: ${{ matrix.output_dir }}
          DEST_DIR: release-staging
        run: node scripts/collect-installer-artifacts.mjs

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release-staging
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  publish:
    name: Publish distribution
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Sync distribution manifest
        run: node scripts/sync-release-manifest.mjs

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Collect installer payload
        env:
          SOURCE_DIR: release-assets
          DEST_DIR: dist-payload
        run: node scripts/collect-installer-artifacts.mjs

      - name: Publish GitHub Release on axatalk-releases
        env:
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.AXATALK_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PAYLOAD_DIR: dist-payload
        run: node scripts/publish-distribution-release.mjs

      - name: Push manifest and README to axatalk-releases main
        env:
          GITHUB_TOKEN: ${{ secrets.AXATALK_RELEASES_TOKEN }}
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.AXATALK_RELEASES_TOKEN }}
          DIST_COMMIT_MSG: "chore(release): sync manifest for ${{ github.ref_name }}"
        run: node scripts/push-distribution-repo.mjs
