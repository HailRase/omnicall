name: Release

# Tag v*.*.* → build all platforms + publish GitHub Release assets.
# workflow_dispatch → build only (Artifacts), no Release publish.
# Guide: docs/softphone/RELEASE-PLAYBOOK.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            artifact_glob: dist/win/**
          - os: macos-latest
            build_script: build:mac
            artifact_glob: dist/mac/**
          - os: ubuntu-latest
            build_script: build:linux
            artifact_glob: dist/linux/**

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build installer
        run: npm run ${{ matrix.build_script }}
        env:
          EPUBLISH: never
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: List release files
        shell: bash
        run: find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Axatalk ${{ github.ref_name }}
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: false
