name: Release

# Tag v*.*.* on softphone-electron - build installers - publish to axatalk-releases.
# workflow_dispatch → build only (Artifacts), no publish.
# Guide: guides/RELEASE-PLAYBOOK.md, guides/Distribution-Migration-Checklist.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            artifact_glob: dist/win/**
          - os: macos-latest
            build_script: build:mac
            artifact_glob: dist/mac/**
          - os: ubuntu-latest
            build_script: build:linux
            artifact_glob: dist/linux/**

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build installer
        run: npm run ${{ matrix.build_script }}
        env:
          EPUBLISH: never
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync distribution manifest
        run: node scripts/sync-release-manifest.mjs

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Collect installer binaries only
        shell: bash
        run: |
          mkdir -p dist-payload
          find release-assets -type f \( \
            -name 'Axatalk-*.exe' -o -name 'Axatalk-*.dmg' -o -name 'Axatalk-*.AppImage' -o -name 'Axatalk-*.deb' \
          \) -exec cp {} dist-payload/ \;
          echo "Payload:"
          ls -la dist-payload/
          if [ -z "$(ls -A dist-payload)" ]; then
            echo "No installer files found"
            exit 1
          fi

      - name: Publish GitHub Release on axatalk-releases
        env:
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.AXATALK_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PAYLOAD_DIR: dist-payload
        run: node scripts/publish-distribution-release.mjs

      - name: Push manifest and README to axatalk-releases main
        env:
          GITHUB_TOKEN: ${{ secrets.AXATALK_RELEASES_TOKEN }}
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.AXATALK_RELEASES_TOKEN }}
          DIST_COMMIT_MSG: "chore(release): sync manifest for ${{ github.ref_name }}"
        run: node scripts/push-distribution-repo.mjs
