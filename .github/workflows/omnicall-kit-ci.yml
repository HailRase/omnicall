name: OmniCall Kit CI

on:
  push:
    paths:
      - 'omnicall-kit/**'
      - '.github/workflows/omnicall-kit-ci.yml'
  pull_request:
    paths:
      - 'omnicall-kit/**'
      - '.github/workflows/omnicall-kit-ci.yml'

concurrency:
  group: omnicall-kit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: omnicall-kit

jobs:
  preflight:
    name: SDK preflight and package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: omnicall-kit/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Preflight
        run: npm run preflight
        env:
          OMNICALL_SDK_BROWSER: '1'
          CI: 'true'

      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: omnicall-kit-tarballs
          path: |
            omnicall-kit/temp/tarballs/*.tgz
            omnicall-kit/temp/tarballs/manifest.json
          if-no-files-found: error

      - name: Guard against accidental publish
        run: |
          if grep -R -n -E 'npm[[:space:]]+publish|changeset[[:space:]]+publish' scripts package.json packages/*/package.json; then
            echo "Publish commands must not run in SDK-00 CI."
            exit 1
          fi
          echo "No publish step present."
