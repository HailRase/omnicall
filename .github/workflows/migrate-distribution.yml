name: Migrate distribution releases

# One-time: copy installer assets from softphone-electron releases to omnicall-releases.
# Secrets: OMNICALL_RELEASES_TOKEN (write omnicall-releases only).
# Source read uses github.token (same repo). Guide: guides/Distribution-Migration-Checklist.md

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated tags, e.g. v0.0.1,v0.0.2"
        required: true
        default: "v0.0.1,v0.0.2"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Verify distribution token
        env:
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.OMNICALL_RELEASES_TOKEN }}
        run: |
          if [ -z "$DISTRIBUTION_GITHUB_TOKEN" ]; then
            echo "::error::OMNICALL_RELEASES_TOKEN secret is empty. Add fine-grained PAT with Contents read+write on omnicall-releases."
            exit 1
          fi
          node --input-type=module -e "
            import { verifyDistributionToken } from './scripts/github-distribution-api.mjs';
            await verifyDistributionToken(process.env.DISTRIBUTION_GITHUB_TOKEN.trim(), 'HailRase/omnicall-releases');
            console.log('Distribution token OK');
          "

      - name: Migrate releases to omnicall-releases
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.OMNICALL_RELEASES_TOKEN }}
        run: |
          TAGS="${{ github.event.inputs.tags }}"
          TAG_ARGS=""
          IFS=',' read -ra PARTS <<< "$TAGS"
          for t in "${PARTS[@]}"; do
            TAG_ARGS="$TAG_ARGS $(echo "$t" | xargs)"
          done
          node scripts/migrate-distribution-releases.mjs $TAG_ARGS
