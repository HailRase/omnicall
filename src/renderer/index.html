<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:; media-src 'self' blob:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axatalk</title>
    <!--
      Single-stage bootstrap splash (F-016 / LF-002).
      Contract: docs/softphone/Bootstrap-Splash-Contract.md
      React drives this node via bootSplashDom (progress / message / settle / dismiss).
      Brand mid: #42AAFF — sync startupSplashColors.ts + tokens.css.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f3f6fb;
        color: #1a2332;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #111722;
          color: #e8eef8;
        }

        #boot-splash .boot-message {
          color: #9aa8bd;
        }

        #boot-splash .boot-track {
          background: #1a2435;
        }

        #boot-splash .boot-shadow {
          background: radial-gradient(
            ellipse at center,
            rgba(0, 0, 0, 0.62) 0%,
            rgba(0, 0, 0, 0.28) 42%,
            transparent 72%
          );
        }

        #boot-splash {
          background: #111722;
        }

        #boot-splash .boot-atmosphere {
          background:
            radial-gradient(55% 45% at 50% 38%, rgba(66, 170, 255, 0.24) 0%, transparent 70%),
            radial-gradient(70% 60% at 50% 100%, rgba(21, 32, 48, 0.8) 0%, transparent 65%);
        }
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        pointer-events: none;
        overflow: hidden;
        /* Opaque layer so the ready shell crossfades cleanly underneath. */
        background: #f3f6fb;
        opacity: 1;
        transition:
          opacity 420ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 420ms linear;
      }

      /* Crossfade out over the ready shell (keep in sync with BOOT_SPLASH_EXIT_MS). */
      #boot-splash[data-exiting="true"] {
        opacity: 0;
        visibility: hidden;
      }

      #boot-splash[data-exiting="true"] .boot-content {
        transform: translateY(-0.35rem) scale(0.985);
        transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #boot-splash .boot-atmosphere {
        position: absolute;
        inset: -20%;
        pointer-events: none;
        background:
          radial-gradient(55% 45% at 50% 38%, rgba(66, 170, 255, 0.2) 0%, transparent 70%),
          radial-gradient(70% 60% at 50% 100%, rgba(238, 242, 248, 0.85) 0%, transparent 65%);
        opacity: 0.88;
        animation: boot-atmosphere-breathe 5.5s ease-in-out infinite;
      }

      #boot-splash .boot-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        max-width: 280px;
        padding: 24px;
      }

      #boot-splash .boot-ball-stage {
        position: relative;
        width: 5.75rem;
        height: 8.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
      }

      /* Brand: #6BC4FF → #42AAFF → #2A8FD9 */
      #boot-splash .boot-ball {
        position: relative;
        z-index: 1;
        width: 5.5rem;
        height: 5.5rem;
        display: grid;
        place-items: center;
        border-radius: 9999px;
        color: #ffffff;
        background: linear-gradient(165deg, #6bc4ff 0%, #42aaff 48%, #2a8fd9 100%);
        box-shadow:
          0 0.55rem 1.35rem rgba(66, 170, 255, 0.42),
          inset 0 0.12rem 0.4rem rgba(255, 255, 255, 0.35);
        transform-origin: 50% 100%;
        will-change: transform;
        /* linear + parabolic Y samples = gravity (fast leave, slow apex, fast fall) */
        animation: boot-ball-bounce 1000ms linear infinite;
      }

      #boot-splash .boot-ball svg {
        width: 2.25rem;
        height: 2.25rem;
        display: block;
      }

      /* Oval ground shadow — radial soft edge, no animated filter:blur. */
      #boot-splash .boot-shadow {
        position: absolute;
        bottom: -0.2rem;
        left: 50%;
        width: 3.6rem;
        height: 0.9rem;
        margin-left: -1.8rem;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(26, 35, 50, 0.48) 0%,
          rgba(26, 35, 50, 0.22) 42%,
          transparent 72%
        );
        transform-origin: center center;
        will-change: transform, opacity;
        animation: boot-ball-shadow 1000ms linear infinite;
      }

      #boot-splash .boot-brand {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #boot-splash .boot-message {
        margin: 0;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: #5b6b82;
      }

      #boot-splash .boot-track {
        width: 12.5rem;
        height: 8px;
        margin-top: 4px;
        overflow: hidden;
        border-radius: 9999px;
        background: #eef2f8;
      }

      #boot-splash .boot-indicator {
        width: 50%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6bc4ff, #42aaff, #2a8fd9);
        animation: boot-indeterminate 1.2s ease-in-out infinite;
        will-change: transform;
      }

      #boot-splash[data-progress-mode="determinate"] .boot-indicator {
        width: 100%;
        animation: none;
        transition: transform 180ms ease;
        transform: translateX(-100%);
      }

      @keyframes boot-atmosphere-breathe {
        0%,
        100% {
          opacity: 0.78;
        }
        50% {
          opacity: 0.95;
        }
      }

      /*
        Ballistic bounce: Y ≈ H·4·t·(1−t) sampled at equal time (linear timing).
        Fast off the ground → decelerate to apex → accelerate into landing.
        0% === 100% for a seamless loop. Settle is freeze→rest in bootSplashDom.
      */
      @keyframes boot-ball-bounce {
        0% {
          transform: translateY(0) scaleX(1.18) scaleY(0.82);
        }
        6% {
          transform: translateY(-0.81rem) scaleX(1.04) scaleY(0.96);
        }
        12% {
          transform: translateY(-1.52rem) scaleX(0.98) scaleY(1.02);
        }
        25% {
          transform: translateY(-2.7rem) scaleX(0.95) scaleY(1.05);
        }
        37% {
          transform: translateY(-3.36rem) scaleX(0.94) scaleY(1.06);
        }
        50% {
          transform: translateY(-3.6rem) scaleX(0.93) scaleY(1.07);
        }
        63% {
          transform: translateY(-3.36rem) scaleX(0.94) scaleY(1.06);
        }
        75% {
          transform: translateY(-2.7rem) scaleX(0.95) scaleY(1.05);
        }
        88% {
          transform: translateY(-1.52rem) scaleX(0.98) scaleY(1.02);
        }
        94% {
          transform: translateY(-0.81rem) scaleX(1.04) scaleY(0.96);
        }
        100% {
          transform: translateY(0) scaleX(1.18) scaleY(0.82);
        }
      }

      @keyframes boot-ball-shadow {
        0%,
        100% {
          transform: scaleX(1.24) scaleY(1);
          opacity: 0.92;
        }
        6%,
        94% {
          transform: scaleX(1.06) scaleY(0.98);
          opacity: 0.62;
        }
        12%,
        88% {
          transform: scaleX(0.88) scaleY(0.94);
          opacity: 0.45;
        }
        25%,
        75% {
          transform: scaleX(0.62) scaleY(0.88);
          opacity: 0.26;
        }
        37%,
        63% {
          transform: scaleX(0.5) scaleY(0.84);
          opacity: 0.16;
        }
        50% {
          transform: scaleX(0.44) scaleY(0.8);
          opacity: 0.12;
        }
      }

      @keyframes boot-indeterminate {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash[data-exiting="true"] .boot-content {
          transition: none;
        }

        #boot-splash .boot-atmosphere,
        #boot-splash .boot-ball,
        #boot-splash .boot-shadow,
        #boot-splash .boot-indicator {
          animation: none;
        }

        #boot-splash .boot-atmosphere {
          opacity: 0.85;
        }

        #boot-splash .boot-ball {
          transform: none;
        }

        #boot-splash .boot-shadow {
          opacity: 0.35;
          transform: scaleX(1);
        }

        #boot-splash[data-progress-mode="determinate"] .boot-indicator {
          transition: none;
        }
      }

      #root {
        position: relative;
        z-index: 1;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-atmosphere"></div>
      <div class="boot-content">
        <div class="boot-ball-stage">
          <div class="boot-ball">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="boot-shadow"></div>
        </div>
        <p class="boot-brand">Axatalk</p>
        <p class="boot-message" id="boot-splash-message">Loading application…</p>
        <div class="boot-track">
          <div class="boot-indicator" id="boot-splash-indicator"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function bootSplashBootstrap() {
        var loadingByLang = {
          ru: "Загрузка приложения…",
          en: "Loading application…",
          fr: "Chargement de l'application…",
          de: "Anwendung wird geladen…",
          bg: "Зареждане на приложението…",
        };
        var lang = String(navigator.language || "en")
          .slice(0, 2)
          .toLowerCase();
        var messageNode = document.getElementById("boot-splash-message");
        if (messageNode) {
          messageNode.textContent = loadingByLang[lang] || loadingByLang.en;
        }
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
