appId: com.axata.axatalk
productName: Axatalk
copyright: Copyright © 2026 Axata
directories:
  buildResources: build
  # Per-platform output is set in package.json build:* scripts (dist/win, dist/mac, dist/linux, dist/all).
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!src/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,install-instruction.md}"
  - "!{.env,.env.local,.env.*.local}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}"
  - "!{docs/**,work-history/**,.cursor/**,.storybook/**,scripts/**}"
asar: true
npmRebuild: false
# Manual GitHub Release uploads only — do not auto-publish on CI (no GH_TOKEN required).
publish: null
win:
  executableName: Axatalk
  icon: icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  category: public.app-category.business
  icon: icon.icns
  target:
    - dmg
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Axatalk needs microphone access for voice calls.
    NSCameraUsageDescription: Axatalk may use the camera for video calls.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  category: Network
  maintainer: Axata
  syncDesktopName: true
  icon: icon.png
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
extraResources:
  - from: build/theme-icons
    to: theme-icons
    filter:
      - icon-dark.png
      - icon-light.png
