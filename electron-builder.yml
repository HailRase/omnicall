appId: com.axata.axatalk
productName: Axatalk
copyright: Copyright © 2026 Axata
directories:
  buildResources: build
  # Per-platform output is set in package.json build:* scripts (dist/win, dist/mac, dist/linux, dist/all).
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!src/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,install-instruction.md,guides/**}"
  - "!{.env,.env.local,.env.*.local}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}"
  - "!{docs/**,work-history/**,.cursor/**,.storybook/**,scripts/**}"
asar: true
npmRebuild: false
# F-020 manual manifest — no electron-updater publish on CI (see scripts/run-electron-builder.mjs).
publish: null
generateUpdatesFilesForAllChannels: false
win:
  executableName: Axatalk
  icon: icon.ico
  target:
    - nsis
    - msi
  artifactName: ${productName}-${version}-win-${arch}.${ext}
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  upgradeCode: 8F3C2A1B-4D5E-6F70-8A9B-0C1D2E3F4A5B
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  category: public.app-category.business
  icon: icon.icns
  target:
    - dmg
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Axatalk needs microphone access for voice calls.
    NSCameraUsageDescription: Axatalk may use the camera for video calls.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  category: Network
  maintainer: Axata
  syncDesktopName: true
  icon: icons
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
extraResources:
  - from: build/theme-icons
    to: theme-icons
    filter:
      - icon-dark.png
      - icon-light.png
  - from: build/windows-theme-icons
    to: windows-theme-icons
    filter:
      - icon-dark.png
      - icon-light.png
